<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Arab - اللعبة الرئيسية</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-bottom: 20px; color: #007acc; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: white; outline: none; }
    input:focus { border-color: #007acc; }
    button { width: 100%; padding: 12px; background: #007acc; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
    button:hover { background: #005999; }
    
    #home-screen { display: none; text-align: center; width: 100%; max-width: 800px; padding: 20px; }
    .nav-bar { background: #1e1e1e; padding: 15px 25px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border: 1px solid #333; }
    .btn-studio { background: #28a745; margin-top: 15px; }
    .btn-studio:hover { background: #218838; }
    .status-msg { margin-top: 10px; font-size: 13px; color: #28a745; }
    .badge { background: #17a2b8; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-card" class="card">
    <h2>Roblox Arab 🎮</h2>
    <p style="color:#888; font-size:12px; margin-bottom:15px;">تسجيل دخول سريع</p>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    
    <button onclick="localLogin()">دخول سريع 🔓</button>
    <div id="status" class="status-msg"></div>
  </div>

  <!-- شاشة الـ Home القائمة الرئيسية -->
  <div id="home-screen">
    <div class="nav-bar">
      <h3>مرحباً بك يا <span id="user-display" style="color: #007acc;">لاعب</span> 👋 <span class="badge">Online</span></h3>
      <button onclick="logout()" style="width: auto; padding: 8px 15px; background: #dc3545;">خروج</button>
    </div>

    <div class="card" style="width: 100%;">
      <h2>القائمة الرئيسية (Home)</h2>
      <p style="color: #aaa; margin-bottom: 20px;">اختر ماب الاستوديو لتصميم ونشر المابات أونلاين 🌐</p>
      
      <button style="margin-bottom: 10px;" onclick="alert('جاري التحميل...')">🎮 دخول الماب الرئيسية</button>
      
      <!-- زرار الدخول على ماب الاستوديو -->
      <button class="btn-studio" onclick="window.location.href='studio.html'">🛠️ دخول ماب صانع المابات (Studio)</button>
    </div>
  </div>

  <script>
    function localLogin() {
      const user = document.getElementById('username').value.trim();
      const status = document.getElementById('status');

      if (!user) {
        status.style.color = "#dc3545";
        status.innerText = "اكتب اسم المستخدم!";
        return;
      }

      localStorage.setItem('localUser', user);
      status.style.color = "#28a745";
      status.innerText = "تم الدخول بنجاح!";
      
      setTimeout(() => showHomeScreen(user), 500);
    }

    window.onload = function() {
      const savedUser = localStorage.getItem('localUser');
      if (savedUser) {
        showHomeScreen(savedUser);
      }
    };

    function showHomeScreen(username) {
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('home-screen').style.display = 'block';
      document.getElementById('user-display').innerText = username;
    }

    function logout() {
      localStorage.removeItem('localUser');
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('login-card').style.display = 'block';
      document.getElementById('status').innerText = '';
    }
  </script>
</body>
</html>
