<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roblox Global Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #191919; color: white; overflow-x: hidden; user-select: none;
        }
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .auth-box {
            background: #232527; padding: 40px; border-radius: 12px;
            text-align: center; width: 320px; border: 1px solid #393b3d;
        }
        .auth-box input {
            display: block; width: 100%; margin: 10px 0; padding: 12px;
            border: 1px solid #393b3d; background: #111; color: white;
            border-radius: 6px; box-sizing: border-box;
        }
        .auth-box button {
            background: #00a2ff; color: white; border: none; padding: 12px;
            font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px;
        }
        .toggle-text { margin-top: 15px; font-size: 14px; color: #aaa; }
        .toggle-text span { color: #00a2ff; cursor: pointer; text-decoration: underline; }

        #main-dashboard { display: none; padding: 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: #232527; padding: 15px 30px; border-radius: 8px; margin-bottom: 25px;
        }
        .logo { font-size: 24px; font-weight: bold; color: #00a2ff; }
        .user-info { font-size: 18px; font-weight: bold; }

        .section-title { font-size: 22px; margin-bottom: 15px; border-bottom: 2px solid #393b3d; padding-bottom: 5px; }

        .global-players-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 30px; }
        .player-card {
            background: #232527; padding: 15px; border-radius: 8px; text-align: center;
            min-width: 110px; border: 1px solid #393b3d; position: relative;
        }
        .player-avatar { width: 50px; height: 50px; background: #00a2ff; border-radius: 50%; margin: 0 auto 10px; position: relative; }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%; background: #00e676;
            position: absolute; bottom: 2px; right: 2px; border: 2px solid #232527;
        }

        .empty-maps-box {
            background: #232527;
            border: 2px dashed #393b3d;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            color: #888;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box" id="login-form">
            <h2>تسجيل الدخول العام</h2>
            <input type="text" id="login-username" placeholder="اسم المستخدم">
            <input type="password" id="login-password" placeholder="كلمة المرور">
            <button id="login-btn">دخول السيرفر</button>
            <div class="toggle-text">معندكش حساب؟ <span id="go-to-signup">إنشاء حساب جديد</span></div>
        </div>

        <div class="auth-box" id="signup-form" style="display: none;">
            <h2>حساب جديد أونلاين</h2>
            <input type="text" id="signup-username" placeholder="اختر اسم فريد">
            <input type="password" id="signup-password" placeholder="كلمة المرور">
            <button id="signup-btn">تسجيل وانضمام</button>
            <div class="toggle-text">عندك حساب؟ <span id="go-to-login">تسجيل الدخول</span></div>
        </div>
    </div>

    <div id="main-dashboard">
        <header>
            <div class="logo">ROBLOX GLOBAL</div>
            <div class="user-info">مرحباً بك هنا، <span id="display-user"></span> 🌐</div>
        </header>

        <div class="section-title">اللاعبون المتواجدون أونلاين في العالم</div>
        <div class="global-players-container" id="online-players-list"></div>

        <div class="section-title">المابات</div>
        <div class="empty-maps-box">
            لا توجد مابات مضافة حالياً. (قيد التجهيز من Unity)
        </div>
    </div>

    <script>
        // البيانات الحقيقية الخاصة بمشروعك من فايربيس
        const firebaseConfig = {
            apiKey: "AIzaSyCbF2TjeJ35WXhcfcJl_8kPE3ME9z3ET2M",
            authDomain: "com-example-myapplicatio-5fef3.firebaseapp.com",
            databaseURL: "https://com-example-myapplicatio-5fef3-default-rtdb.firebaseio.com",
            projectId: "com-example-myapplicatio-5fef3",
            storageBucket: "com-example-myapplicatio-5fef3.firebasestorage.app",
            messagingSenderId: "363463760434",
            appId: "1:363463760434:web:095ed8eea647491d68fa2b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";

        document.getElementById('go-to-signup').addEventListener('click', () => {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
        });

        document.getElementById('go-to-login').addEventListener('click', () => {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        });

        // تسجيل حساب جديد
        document.getElementById('signup-btn').addEventListener('click', () => {
            const user = document.getElementById('signup-username').value.trim();
            const pass = document.getElementById('signup-password').value.trim();
            if (!user || !pass) return alert("الرجاء إدخال البيانات كاملة!");

            db.ref('users/' + user).once('value')
            .then((snapshot) => {
                if (snapshot.exists()) {
                    alert("هذا الاسم مستخدم بالفعل، اختر اسمًا آخر!");
                } else {
                    return db.ref('users/' + user).set({ password: pass });
                }
            })
            .then(() => {
                alert("تم إنشاء الحساب بنجاح!");
                loginSuccess(user);
            })
            .catch((error) => {
                alert("خطأ أثناء التسجيل: " + error.message);
            });
        });

        // تسجيل الدخول
        document.getElementById('login-btn').addEventListener('click', () => {
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            if (!user || !pass) return alert("الرجاء إدخال البيانات!");

            db.ref('users/' + user).once('value')
            .then((snapshot) => {
                if (!snapshot.exists()) {
                    alert("اسم المستخدم هذا غير موجود في النظام!");
                } else if (snapshot.val().password !== pass) {
                    alert("كلمة المرور غير صحيحة!");
                } else {
                    loginSuccess(user);
                }
            })
            .catch((error) => {
                alert("خطأ في الاتصال: " + error.message);
            });
        });

        function loginSuccess(user) {
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('display-user').innerText = user;

            const onlineRef = db.ref('online_players/' + user);
            onlineRef.set({ name: user, time: Date.now() });
            onlineRef.onDisconnect().remove();

            listenToOnlinePlayers();
        }

        function listenToOnlinePlayers() {
            const container = document.getElementById('online-players-list');
            db.ref('online_players').on('value', (snapshot) => {
                container.innerHTML = "";
                const players = snapshot.val();
                if (!players) {
                    container.innerHTML = `<div style="color: #888; padding: 10px;">لا يوجد لاعبين متواجدين حالياً</div>`;
                    return;
                }

                Object.keys(players).forEach(pKey => {
                    const playerObj = players[pKey];
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <div class="player-avatar">
                            <div class="status-dot"></div>
                        </div>
                        <div>${playerObj.name}</div>
                    `;
                    container.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
