<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الماب الرئيسية - Roblox Arab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background-color: #000; font-family: sans-serif; }
  
  /* زرار الخروج للقائمة الرئيسية */
  #back-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 100;
    padding: 10px 20px;
    background-color: #dc3545;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  #back-btn:hover { background-color: #bd2130; }
  
  #game-container { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<button id="back-btn" onclick="window.location.href='index.html'">🔙 العودة للقائمة الرئيسية</button>
<div id="game-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // كود تشغيل الماب الرئيسية
  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // إضاءة ورضية الماب
  const gridHelper = new THREE.GridHelper(20, 20, 0x007acc, 0x444444);
  scene.add(gridHelper);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 10, 7);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));

  // إضافة مجسم الماب الرئيسية (يمكنك إضافة تفاصيل مابك هنا)
  const geometry = new THREE.BoxGeometry(2, 2, 2);
  const material = new THREE.MeshStandardMaterial({ color: 0x007acc });
  const cube = new THREE.Mesh(geometry, material);
  cube.position.y = 1;
  scene.add(cube);

  // تحريك بسيط للتأكد إن الماب شغالة
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
