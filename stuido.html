<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماب الاستوديو - Roblox Studio Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { overflow: hidden; background-color: #1e1e1e; color: white; }
    
    #toolbar {
      height: 50px;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }
    
    .btn-group { display: flex; gap: 8px; }
    .btn {
      padding: 6px 12px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #444; }
    .btn-publish { background: #28a745; border: none; font-weight: bold; }
    .btn-publish:hover { background: #218838; }
    .btn-back { background: #dc3545; border: none; font-weight: bold; }
    .btn-back:hover { background: #bd2130; }

    #main-container { display: flex; height: calc(100vh - 50px); }
    #explorer {
      width: 220px;
      background: #252526;
      border-left: 1px solid #3c3c3c;
      padding: 10px;
    }
    #viewport { flex: 1; background: #111; }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div id="toolbar">
    <div style="font-weight: bold; color: #007acc;">🛠️ ماب صانع المابات</div>
    
    <div class="btn-group">
      <button class="btn" onclick="createShape('box', 'ازرق')">➕ إضافة Part</button>
      <button class="btn" onclick="moveSelected(0, 1, 0)">⬆️ رفع</button>
      <button class="btn" onclick="scaleSelected(1.2)">📐 تكبير</button>
      <button class="btn btn-publish" onclick="publishMap()">🚀 نشر الماب (Publish)</button>
    </div>

    <!-- زرار العودة للقائمة الرئيسية -->
    <button class="btn btn-back" onclick="window.location.href='index.html'">🔙 العودة للقائمة الرئيسية</button>
  </div>

  <!-- الشاشة الرئيسية للاستوديو -->
  <div id="main-container">
    <div id="explorer">
      <h4 style="color:#007acc; margin-bottom:10px;">📁 Explorer</h4>
      <div id="workspace-list"></div>
    </div>
    <div id="viewport"></div>
  </div>

  <!-- مكتبة Three.js ومحرك الاستوديو والفايربيس -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="builder.js"></script>
  <script>
    window.onload = function() {
      if (typeof openStudio === 'function') {
        openStudio();
      }
    };
  </script>
</body>
</html>
